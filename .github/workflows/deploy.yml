name: Build, validate, and push to Drive

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build pages from config
        run: python3 src/build.py

      - name: Validate generated pages
        run: python3 test/validate_build.py

      - name: Commit regenerated pages back to the repo (if changed)
        run: |
          git config user.name "thespta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate pages from config [skip ci]"
            git push
          else
            echo "No changes to pages/ — nothing to commit."
          fi

      - name: Install Google API client libraries
        run: pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Push pages and images to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python3 scripts/push_to_drive.py
