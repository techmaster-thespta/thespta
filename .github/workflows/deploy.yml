name: Build, validate, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Sync events from Google Calendar
        run: python3 scripts/sync_calendar_events.py

      - name: Build pages from config
        run: python3 src/build.py

      - name: Validate generated pages
        run: python3 test/validate_build.py

      - name: Commit regenerated pages back to the repo (if changed)
        run: |
          git config user.name "thespta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/ config/events.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync events from calendar, regenerate pages [skip ci]"
            git push
          else
            echo "No changes to pages/ or config/events.json — nothing to commit."
          fi

      - name: Assemble the deployed site
        run: |
          mkdir -p site/images
          cp pages/*.html site/
          cp pages/CNAME site/
          find assets/images -maxdepth 1 -type f ! -name "*.md" -exec cp {} site/images/ \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
